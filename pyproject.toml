[project]
name = "shadow-onboarding"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=1.7.0",
    "fastapi>=0.141.1",
    "jsonschema>=4.26.0",
    "openai>=3.16.2",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
