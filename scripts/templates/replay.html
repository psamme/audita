<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audita | Recorded judging replay</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f2ee;color:#181818;font:18px/1.6 system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:40px}header{font-size:12px;letter-spacing:.1em;text-transform:uppercase;border-bottom:1px solid #aaa;padding-bottom:20px}h1{font-size:clamp(34px,5vw,64px);line-height:1.1;letter-spacing:-2px}h2{font-size:28px;line-height:1.3}h3{margin:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{border:1px solid #ccc;border-radius:10px;padding:24px;background:#fff}.big{font-size:52px;font-weight:500}.muted{font-size:14px;color:#555}.tag{font:12px monospace;text-transform:uppercase}button{font:inherit;padding:12px 22px;cursor:pointer;background:#191919;color:white;border:0;border-radius:4px}button:disabled{opacity:.3}nav{display:flex;justify-content:space-between;align-items:center;margin-top:30px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}details{margin-top:18px}footer{margin:30px 0;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}main{padding:22px}}
</style></head><body><main><header>Audita · Recorded execution · Offline backup</header><div id="view"></div><nav><button id="back">← Back</button><span id="position"></span><button id="next">Next →</button></nav><footer>Synthetic history and constructed demonstration cases. Captured from real pipeline, approval and undo execution. This file replays saved results; its buttons do not run a model or modify policies.</footer></main><script>
const d=/*RECORDED_DATA*/;
let step=0;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const short=c=>c.items.find(i=>i.item_id.endsWith('SHORT-0'));
const evidence=c=>{const i=short(c);const g=c.groups.find(g=>g.approve_rule);const ps=g?.precedents||i.precedents;return `<details><summary>Historical evidence and provenance</summary>${ps.map(p=>`<p class="muted"><b>${esc(p.id)}</b> · ${esc(p.date)}<br>${esc(p.text)}<br>${p.booked.map(b=>`${b.amount} → ${esc(b.account)} by ${esc(b.by)}`).join('<br>')}</p>`).join('')}<pre>${esc(JSON.stringify(c.origin,null,2))}</pre></details>`};
const compare=report=>`<div class="grid">${report.results.map(c=>{const i=short(c);return `<article class="card"><div class="tag">${esc(c.name)}</div><h2>${i.resolution.action==='match_adjust'?'Match; book $12.40 to '+esc(i.resolution.adjustments[0].account):'Review with '+esc(i.resolution.escalate_to?.replaceAll('_',' '))}</h2><p class="muted">${esc((c.groups.find(g=>g.approve_rule)?.rule || i.rule)?.text||i.resolution.rationale)}</p>${evidence(c)}</article>`}).join('')}</div>`;
const steps=[
()=>`<h1>What do you do about $12.40?</h1><p>It depends who you work for. Audita reconstructs each finance team's conventions from its historical decisions.</p><div class="grid">${d.before.results.map(c=>`<article class="card"><div class="tag">${esc(c.name)}</div><div class="big">${c.history_bank_lines}</div><p>historical bank lines → ${c.rules.length} inferred rules</p><p class="muted">January and February history. Saved model induction, checked by code.</p>${evidence(c)}</article>`).join('')}</div>`,
()=>`<h1>History proposes. A person decides.</h1><p>The same $4,787.60 receipt against a $4,800 invoice. Lucky Quarter's history suggests small write-offs, but contains conflicting account choices. Meridian's proposal routes the difference to its AR lead.</p>${compare(d.before)}`,
()=>`<h1>One answer. Three cases.</h1><p>The reviewer explicitly adopts the shortfall rule and its account, effective May 1, with a $15 limit. Preview shows the effect before saving.</p><div class="card"><div class="big">${d.preview.before.needs_review} → ${d.preview.after.needs_review}</div><p>bank items needing review</p>${d.preview.changed_items.filter(i=>i.item_kind==='bank').map(i=>`<p class="muted">${esc(i.item_id)}: review → match and book ${i.after.adjustments.map(a=>'$'+a.amount.toFixed(2)+' to '+esc(a.account)).join(', ')}</p>`).join('')}</div>`,
()=>`<h1>Same receipt. Different decisions.</h1><p>The signed policy now clears Lucky Quarter's receipt and its two siblings. Meridian's policy is unchanged. No model call is needed for the rerun.</p>${compare(d.after)}`,
()=>`<h1>Two answers clear seven cases.</h1><p>A second answer sets the deposit limit at $50. Four deposits clear. The two vendor payments remain held because bank details changed.</p><div class="grid"><article class="card"><div class="big">9 → ${d.both.results[0].summary.needs_review}</div><p>bank items needing review</p></article><article class="card"><div class="big">2 held</div><p>Both amounts match. Neither bypasses bank-change verification.</p></article></div>`,
()=>`<h1>Undo the policy, not the audit trail.</h1><p>Retracting the shortfall answer checks prior decisions and reopens all three receipts. The independently approved deposit policy stays in force.</p><div class="grid"><article class="card"><div class="big">${d.undo.resolutions_checked} checked</div><p>${d.undo.reopened.length} receipts reopened</p></article><article class="card"><div class="big">${d.restored.results[0].summary.automatic_bank_items} remain clear</div><p>The four deposits keep their valid approval.</p></article></div><p class="muted">Measured benefit here: fewer review items on these demonstration cases. This is not a benchmark accuracy claim.</p>`
];
function paint(){document.getElementById('view').innerHTML=steps[step]();document.getElementById('position').textContent=`${step+1} / ${steps.length}`;document.getElementById('back').disabled=step===0;document.getElementById('next').disabled=step===steps.length-1;scrollTo(0,0)}
document.getElementById('back').onclick=()=>{step--;paint()};document.getElementById('next').onclick=()=>{step++;paint()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&step<steps.length-1){step++;paint()}if(e.key==='ArrowLeft'&&step>0){step--;paint()}});paint();
</script></body></html>
