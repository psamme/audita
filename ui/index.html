<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shadow Onboarding</title>
  <link rel="stylesheet" href="design/fonts/fonts.css">
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="design/components.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <canvas id="slab" aria-hidden="true"></canvas>
  <div class="page">
    <header class="wrap bar">
      <a class="mark" href="index.html">Shadow Onboarding</a>
      <nav class="nav" aria-label="Screens">
      </nav>
      <div class="row" style="display: flex; gap: 12px; align-items: center;">
        <div class="seg" id="stone" aria-label="Stone">
          <button data-v="statuario">Light</button>
          <button data-v="nero">Dark</button>
        </div>
      </div>
    </header>

    <main class="wrap compact">
      <div class="lede-row">
        <div class="lede">
          <div class="label">The experiment</div>
          <h2>One payment. Two finance teams.</h2>
        </div>
      </div>
      <div class="summary"><span>Both clients received this exact bank line. Neither was configured. Each answer comes from that client's own history.</span></div>
      <div id="view"></div>
    </main>
  </div>

  <script src="design/marble.js"></script>
  <script src="js/api.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/experiment.js"></script>

</html>
