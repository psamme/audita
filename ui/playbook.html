<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playbook · Shadow Onboarding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="design/tokens.css">
  <link rel="stylesheet" href="design/components.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <canvas id="slab" aria-hidden="true"></canvas>
  <div class="page">
    <header class="wrap bar">
      <a class="mark" href="index.html">Shadow Onboarding</a>
      <nav class="nav" aria-label="Screens"></nav>
      <div style="display: flex; gap: 12px; align-items: center;">
        <div class="seg" id="stone" aria-label="Stone">
          <button data-v="statuario">Light</button>
          <button data-v="nero">Dark</button>
        </div>
      </div>
    </header>

    <main class="wrap compact">
      <div class="lede-row">
        <div class="lede">
          <div class="label">Playbook</div>
          <h2>How this client does things, written down</h2>
        </div>
        <div class="runrow">
          <div class="seg" id="client" aria-label="Client"></div>
          <select id="version" class="select" aria-label="Version" style="width: auto;"></select>
        </div>
      </div>
      <div id="summary" class="summary"></div>
      <div id="view"></div>
    </main>
  </div>

  <script src="design/marble.js"></script>
  <script src="js/api.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/playbook.js"></script>
</body>
</html>
