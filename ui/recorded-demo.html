()=>`<h1>One answer. Three receipts cleared.</h1><p>Audita learns a finance team's policies from its past decisions and turns uncertain receipts into focused review questions.</p><div class="grid"><article class="card"><div class="tag">Lucky Quarter · Review queue</div><div class="big">${d.before.results[0].summary.needs_review}</div><p>transactions need review</p><h3>Confirm how to handle shortfalls</h3><p>$12.40 · $13.10 · $14.20 differences</p><p class="muted">A human must confirm the limit and adjustment account before the policy can act.</p></article><article class="card"><div class="tag">Recorded from the working application</div><h2>Review → approve a policy → recheck the queue</h2><p>Use Next to follow the measured before-and-after results. Every step was captured from an actual pipeline run.</p><p class="muted">This is a labelled recording, not a live company workspace. The sample history and receipts are synthetic.</p></article></div>`,
